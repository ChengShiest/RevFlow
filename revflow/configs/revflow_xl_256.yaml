model:
  input_size: 16
  hi_channels: 1024
  lo_channels: 128
  hidden_size: 1152
  depth: 28
  num_heads: 16
  base_model_depth: 8
  num_classes: 1000
flow:
  hi_shift: 8.0
  lo_shift: 2.8284271247461903
  teacher_sigma: [0.1, 0.3]
training:
  epochs: 5
  global_batch: 256
  warmup_epochs: 1
  muon_lr: 0.02
  final_muon_lr: 0.001
  adamw_lr: 0.0003
  ema_decay: 0.9985
  clip_grad: 1.0
  seed: 0
  checkpoint_interval: 500
sampling:
  hi_steps: 25
  lo_steps: 25
  hi_scale: 2.5
  lo_scale: 2.0
  hi_min_time: 0.6
  lo_min_time: 0.0
